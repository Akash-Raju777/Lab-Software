# ==========================================================
# LabTrack Backend Configuration
# ==========================================================
server.port=8080

# Spring Application Name
spring.application.name=labtrack-backend

# -------------------------------------------------------
# Data Source Configuration (Supabase PostgreSQL)
# -------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.uxsggsbldrmkbrttzifs.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:akash@1001777}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# H2 Web Console (available at /h2-console for local debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Expiry Alert Configuration (Threshold in days for "EXPIRING_SOON")
labtrack.expiry.threshold-days=7

# CORS Allowed Origins
labtrack.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,https://*.vercel.app

# Logging
logging.level.com.labtrack=INFO
logging.level.org.springframework.web=INFO

